name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the popup
        2. Select "Browser Window"
        3. Click Start Recording
        4. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Feature area
      options:
        - Recording – Browser Window
        - Recording – Entire Screen
        - Recording – This Tab Only
        - Screenshot – Visible / Area / Full page
        - Video player / Trimmer / Export
        - Annotation Studio
        - Media Library
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Apertur version
      placeholder: "2.1.0 (see chrome://extensions)"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & version
      placeholder: "Chrome 131 / Edge / Brave / Arc"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors (optional)
      description: chrome://extensions → Apertur → "Errors", or "Inspect views → service worker" → Console.
      render: text
