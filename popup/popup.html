<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Recorder HD</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <span class="rec-dot"></span>
        </div>
        <div class="brand-text">
          <h1>Tab Recorder</h1>
          <span class="badge-1080p">1080p Pro</span>
        </div>
      </div>
      <button id="btnHistory" class="icon-btn" title="View Recordings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </button>
    </header>

    <!-- Error Banner -->
    <div id="errorBanner" class="error-banner hidden">
      <span id="errorMessage"></span>
      <button id="btnDismissError" class="close-btn">&times;</button>
    </div>

    <!-- Active Recording View -->
    <section id="recordingView" class="card recording-view hidden">
      <div class="pulse-indicator">
        <span class="pulse-ring"></span>
        <span class="pulse-core"></span>
      </div>
      <div class="status-badge" id="recordingStateLabel">RECORDING TAB</div>
      <div class="timer" id="recordingTimer">00:00:00</div>
      <div class="recording-meta" id="recordingMeta">1080p @ 60 FPS</div>

      <div class="active-controls">
        <button id="btnPauseResume" class="secondary-btn">
          <span id="pauseResumeIcon">⏸</span>
          <span id="pauseResumeText">Pause</span>
        </button>
        <button id="btnStop" class="danger-btn">
          <span class="stop-icon">■</span>
          <span>Stop & Save</span>
        </button>
      </div>
    </section>

    <!-- Configuration View (When idle) -->
    <section id="configView" class="config-view">
      <!-- Resolution & FPS Selector -->
      <div class="setting-group">
        <label class="setting-label">Video Quality</label>
        <div class="pill-selector">
          <button class="pill-option active" data-quality="1080p60">
            <span class="pill-title">1080p 60fps</span>
            <span class="pill-desc">Crisp & Ultra Smooth</span>
          </button>
          <button class="pill-option" data-quality="1080p30">
            <span class="pill-title">1080p 30fps</span>
            <span class="pill-desc">Standard Full HD</span>
          </button>
          <button class="pill-option" data-quality="720p60">
            <span class="pill-title">720p 60fps</span>
            <span class="pill-desc">Smaller File</span>
          </button>
        </div>
      </div>

      <!-- Audio Controls -->
      <div class="setting-group">
        <label class="setting-label">Audio Sources</label>
        <div class="toggle-list">
          <label class="toggle-item">
            <div class="toggle-text">
              <span class="title">Tab Audio</span>
              <span class="desc">System & tab sounds (YouTube, games, etc.)</span>
            </div>
            <input type="checkbox" id="checkTabAudio" checked>
            <span class="switch"></span>
          </label>

          <label class="toggle-item">
            <div class="toggle-text">
              <span class="title">Microphone</span>
              <span class="desc">Your voice commentary</span>
            </div>
            <input type="checkbox" id="checkMic">
            <span class="switch"></span>
          </label>
        </div>
      </div>

      <!-- Cursor & Click Highlight Settings -->
      <div class="setting-group highlight-box">
        <label class="setting-label">
          <span>Cursor & Click Effects</span>
          <span class="badge-feature">Active</span>
        </label>

        <div class="toggle-list">
          <label class="toggle-item">
            <div class="toggle-text">
              <span class="title">Cursor Spotlight Halo</span>
              <span class="desc">High-visibility glow following the pointer</span>
            </div>
            <input type="checkbox" id="checkHalo" checked>
            <span class="switch"></span>
          </label>

          <label class="toggle-item">
            <div class="toggle-text">
              <span class="title">Click Ripple Highlight</span>
              <span class="desc">Animated pulse waves on mouse clicks</span>
            </div>
            <input type="checkbox" id="checkClickRipple" checked>
            <span class="switch"></span>
          </label>
        </div>

        <!-- Color Accent Choice -->
        <div class="theme-choice">
          <span class="sub-label">Highlight Color:</span>
          <div class="theme-bubbles">
            <button class="theme-bubble yellow active" data-theme="yellow" title="Vibrant Amber"></button>
            <button class="theme-bubble cyan" data-theme="cyan" title="Electric Cyan"></button>
            <button class="theme-bubble red" data-theme="red" title="Neon Red"></button>
            <button class="theme-bubble green" data-theme="green" title="Emerald Green"></button>
          </div>
        </div>

        <!-- Interactive Click Test Area -->
        <div id="testClickArea" class="test-click-box" title="Click inside here to test ripple effect!">
          <span>💡 Click here to test cursor effect</span>
        </div>
      </div>

      <!-- Start Button -->
      <button id="btnStart" class="primary-btn">
        <span class="rec-icon">●</span>
        <span>Start 1080p Recording</span>
      </button>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
