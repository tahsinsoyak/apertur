<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Recorder Studio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Ambient Background Glow -->
    <div class="ambient-glow"></div>

    <!-- Header -->
    <header class="app-header">
      <div class="brand-group">
        <div class="logo-mark">
          <span class="beacon-pulse"></span>
          <span class="beacon-core"></span>
        </div>
        <div class="brand-meta">
          <div class="title-row">
            <h1>Tab Recorder</h1>
            <span class="pro-tag">STUDIO</span>
          </div>
          <span class="subtitle">1080p Full HD Engine</span>
        </div>
      </div>

      <button id="btnHistory" class="glass-icon-btn" title="Saved Recordings Library">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
        </svg>
      </button>
    </header>

    <!-- Error Toast -->
    <div id="errorBanner" class="glass-toast hidden">
      <div class="toast-content">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorMessage"></span>
      </div>
      <button id="btnDismissError" class="toast-close">&times;</button>
    </div>

    <!-- Live Recording In-Progress View -->
    <section id="recordingView" class="view-panel recording-active-card hidden">
      <div class="radar-hud">
        <div class="radar-outer-ring"></div>
        <div class="radar-inner-ring"></div>
        <div class="radar-core"></div>
      </div>

      <div class="status-pill">
        <span class="dot-blink"></span>
        <span id="recordingStateLabel">RECORDING IN 1080P</span>
      </div>

      <div class="timecode-display" id="recordingTimer">00:00:00</div>
      
      <div class="specs-pills" id="recordingMeta">
        <span class="spec-pill">1920 × 1080</span>
        <span class="spec-pill">60 FPS</span>
        <span class="spec-pill accent">12 Mbps</span>
      </div>

      <div class="recording-actions">
        <button id="btnPauseResume" class="glass-btn secondary">
          <span id="pauseResumeIcon" class="icon-symbol">⏸</span>
          <span id="pauseResumeText">Pause</span>
        </button>
        <button id="btnStop" class="glass-btn danger">
          <span class="stop-box">■</span>
          <span>Finish & Save</span>
        </button>
      </div>
    </section>

    <!-- Main Idle Configuration View -->
    <section id="configView" class="view-panel config-panel">
      <!-- Resolution & FPS Selection -->
      <div class="section-block">
        <div class="section-title-row">
          <span class="section-title">Video Quality</span>
          <span class="section-note">Hardware Accelerated</span>
        </div>
        <div class="quality-grid">
          <button class="quality-card active" data-quality="1080p60">
            <div class="qc-top">
              <span class="qc-res">1080p</span>
              <span class="qc-fps-tag">60 FPS</span>
            </div>
            <span class="qc-desc">Ultra Smooth • 12 Mbps</span>
          </button>

          <button class="quality-card" data-quality="1080p30">
            <div class="qc-top">
              <span class="qc-res">1080p</span>
              <span class="qc-fps-tag muted">30 FPS</span>
            </div>
            <span class="qc-desc">Full HD • Standard</span>
          </button>

          <button class="quality-card" data-quality="720p60">
            <div class="qc-top">
              <span class="qc-res">720p</span>
              <span class="qc-fps-tag muted">60 FPS</span>
            </div>
            <span class="qc-desc">Lightweight • Compact</span>
          </button>
        </div>
      </div>

      <!-- Audio Sources Selection -->
      <div class="section-block">
        <span class="section-title">Audio Capture</span>
        <div class="glass-list">
          <label class="glass-row">
            <div class="row-info">
              <div class="row-icon-box">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
              </div>
              <div class="row-text">
                <span class="row-title">Tab Audio</span>
                <span class="row-desc">Plays through speakers & captures in video</span>
              </div>
            </div>
            <input type="checkbox" id="checkTabAudio" checked>
            <span class="custom-switch"></span>
          </label>

          <label class="glass-row">
            <div class="row-info">
              <div class="row-icon-box">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                  <line x1="12" y1="19" x2="12" y2="23"/>
                  <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
              </div>
              <div class="row-text">
                <span class="row-title">Microphone Commentary</span>
                <span class="row-desc">Mix voice with tab audio in real-time</span>
              </div>
            </div>
            <input type="checkbox" id="checkMic">
            <span class="custom-switch"></span>
          </label>
        </div>
      </div>

      <!-- Studio Cursor & Click Highlight Studio -->
      <div class="section-block studio-effects-card">
        <div class="effects-header">
          <div class="effects-badge-title">
            <span class="sparkle-icon">✦</span>
            <span>Presentation Effects</span>
          </div>
          <span class="status-live-tag">Screen Studio Mode</span>
        </div>

        <div class="glass-list transparent">
          <label class="glass-row compact">
            <div class="row-text">
              <span class="row-title">Cursor Spotlight Halo</span>
              <span class="row-desc">Luminous aura tracking pointer smoothly</span>
            </div>
            <input type="checkbox" id="checkHalo" checked>
            <span class="custom-switch"></span>
          </label>

          <label class="glass-row compact">
            <div class="row-text">
              <span class="row-title">Click Shockwave Ripple</span>
              <span class="row-desc">Expanding pulse waves on mouse down</span>
            </div>
            <input type="checkbox" id="checkClickRipple" checked>
            <span class="custom-switch"></span>
          </label>

          <label class="glass-row compact">
            <div class="row-text">
              <span class="row-title">Floating In-Tab Dock</span>
              <span class="row-desc">Draggable timer & controls inside tab</span>
            </div>
            <input type="checkbox" id="checkFloatingDock" checked>
            <span class="custom-switch"></span>
          </label>
        </div>

        <!-- Color Themes Selector -->
        <div class="theme-row">
          <span class="theme-label">Aesthetic Theme:</span>
          <div class="theme-pills">
            <button class="theme-btn yellow active" data-theme="yellow" title="Amber Gold (Screen Studio)"></button>
            <button class="theme-btn cyan" data-theme="cyan" title="Cyber Cyan"></button>
            <button class="theme-btn violet" data-theme="violet" title="Hyper Violet"></button>
            <button class="theme-btn red" data-theme="red" title="Crimson Neon"></button>
            <button class="theme-btn green" data-theme="green" title="Emerald Pulse"></button>
          </div>
        </div>

        <!-- Interactive Sandbox Inside Popup -->
        <div id="testClickArea" class="interactive-sandbox" title="Click anywhere here to preview halo & shockwave!">
          <div class="sandbox-halo-preview" id="sandboxHalo"></div>
          <div class="sandbox-text">
            <span>✨ Move mouse & click here to test effect</span>
          </div>
        </div>
      </div>

      <!-- Big Neon Action Button -->
      <button id="btnStart" class="neon-record-btn">
        <span class="rec-ring-outer">
          <span class="rec-dot-inner"></span>
        </span>
        <span class="btn-text">Start 1080p Recording</span>
        <span class="btn-subtext">1920 × 1080 • 60 FPS</span>
      </button>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
