<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recording Preview & Export - Tab Recorder HD</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <div class="layout">
    <!-- Main Viewer Area -->
    <main class="main-content">
      <header class="top-nav">
        <div class="brand">
          <div class="rec-icon-wrapper">
            <span class="rec-dot"></span>
          </div>
          <h2>Tab Recorder HD</h2>
          <span class="badge">1080p Studio</span>
        </div>
        <div class="nav-actions">
          <button id="btnOpenLibrary" class="secondary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
            <span>Library</span>
          </button>
        </div>
      </header>

      <!-- Video Player Container -->
      <section class="player-wrapper">
        <div id="loadingOverlay" class="loading-overlay">
          <div class="spinner"></div>
          <p id="loadingStatusText">Loading your recording...</p>
        </div>

        <video id="videoPlayer" controls playsinline></video>
      </section>

      <!-- Control & Details Bar -->
      <section class="video-meta-card">
        <div class="meta-info">
          <h3 id="recordingTitle">Tab Recording</h3>
          <div class="meta-tags">
            <span class="meta-tag" id="tagResolution">1080p</span>
            <span class="meta-tag" id="tagDuration">00:00</span>
            <span class="meta-tag" id="tagSize">0 MB</span>
            <span class="meta-tag" id="tagDate">Today</span>
          </div>
        </div>

        <div class="action-buttons">
          <button id="btnDownload" class="primary-download-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
            </svg>
            <span>Download Video (.webm)</span>
          </button>

          <button id="btnDeleteCurrent" class="danger-icon-btn" title="Delete Recording">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>
      </section>
    </main>

    <!-- Side Library Drawer -->
    <aside id="libraryDrawer" class="sidebar">
      <div class="sidebar-header">
        <h3>Saved Recordings</h3>
        <button id="btnCloseLibrary" class="close-btn">&times;</button>
      </div>

      <div id="libraryList" class="library-list">
        <!-- Recordings injected dynamically -->
      </div>
    </aside>
  </div>

  <script src="../utils/db.js"></script>
  <script src="preview.js"></script>
</body>
</html>
